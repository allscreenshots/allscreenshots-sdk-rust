[package]
name = "allscreenshots-sdk"
version = "1.0.0"
authors = ["Allscreenshots <support@allscreenshots.com>"]
description = "Official Rust SDK for the Allscreenshots API: capture websites, manage jobs, compose images, schedule captures, crawl sites, and read usage."
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE*", "openapi.json", "sdk-provenance.json"]
repository = "https://github.com/allscreenshots/allscreenshots-sdk-rust"
homepage = "https://allscreenshots.com"
documentation = "https://docs.allscreenshots.com"
readme = "README.md"
keywords = ["allscreenshots", "screenshot", "api", "capture", "web"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
